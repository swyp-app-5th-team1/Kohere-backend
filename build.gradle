buildscript {
  dependencies {
    // verifyOpenApiSpec(#151)이 쓰는 YAML 파서. 플러그인 전이 의존에 얹으면 플러그인 업그레이드 한 번에
    // 빌드 스크립트가 깨지므로 명시 선언한다.
    classpath 'org.yaml:snakeyaml:2.4'
  }
  repositories { mavenCentral() }
}

plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.8'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.diffplug.spotless' version '8.6.0'
  // REST Docs 테스트 → OpenAPI3 yaml 생성 (Swagger UI 서빙용, ADR-0016)
  id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.kohere'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenCentral()
}

ext {
  set('springModulithVersion', '1.4.1')
  set('swaggerUiVersion', '5.18.2')
  set('awsSdkVersion', '2.31.78')
  // Google Cloud Java 라이브러리는 공통 BOM으로 맞춰 gRPC·protobuf·auth 전이 버전 충돌을 막는다.
  set('googleCloudLibrariesBomVersion', '26.86.0')
  // SOLAPI SDK 1.1.0은 Kotlin 2.3.0으로 빌드됨(SDK build.gradle.kts: kotlin("jvm") 2.3.0). Boot 3.5.8 관리
  // kotlin 1.9.25로는 런타임 NoSuchMethodError(kotlin.time.Clock.getSystemClock)로 SMS 발송이 500 실패(ADR-0034).
  // stdlib/reflect만 우리 classpath를 쓰고(kotlinx-serialization은 SDK가 shadowJar로 relocate 번들) → 버전만 맞추면 된다.
  set('kotlin.version', '2.3.0')
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  // 1:1 채팅의 WebSocket handshake와 STOMP CONNECT 통로를 연다.
  // 실제 사용자 인증은 HTTP 세션이 아니라 CONNECT native header의 JWT를 검증한다.
  implementation 'org.springframework.boot:spring-boot-starter-websocket'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // BookingCreatedEvent처럼 반드시 처리돼야 하는 모듈 이벤트를 MySQL에 기록한다.
  // starter-jpa가 starter-core를 포함하므로 모듈 구조 검사·기본 이벤트 기능도 그대로 유지된다.
  implementation 'org.springframework.modulith:spring-modulith-starter-jpa'

  // 운영 헬스 체크 — /actuator/health (SecurityConfig permitAll, 로컬 기동 확인·M7 ALB 헬스체크용)
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // 영속 — auth·user=MySQL/JPA(ADR-0005), refresh=Redis(ADR-0006). 운영은 Flyway+validate(ADR-0008)
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  runtimeOnly 'com.mysql:mysql-connector-j'
  //영속 - listing·diagnosis=MongoDB(지오)
  implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

  // MongoDB 1회성 마이그레이션 — Mongock(@ChangeUnit). Flyway의 MongoDB 대응(ADR-0032).
  // Boot 3.5(Framework 6.2)·Spring Data MongoDB 4.x 호환: springboot-v3 + springdata-v4 driver.
  implementation 'io.mongock:mongock-springboot-v3'
  implementation 'io.mongock:mongodb-springdata-v4-driver'

  // 메일 — 온보딩 이메일 인증번호 SMTP 발송(VerificationEmailSender). provider/secrets는 환경변수로 주입
  implementation 'org.springframework.boot:spring-boot-starter-mail'

  // 연락처 SMS 발송 — SOLAPI 국내 SMS API SDK(VerificationSmsSender, ADR-0034). 크리덴셜은 SSM 주입.
  implementation 'com.solapi:sdk:1.1.0'

  // MySQL 스키마 마이그레이션 — Flyway가 DDL 소유, Hibernate는 validate (ADR-0008)
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'

  // 보안 — JWT 검증 보안 필터 (ADR-0010), 소셜 OIDC idToken 검증용 Nimbus JwtDecoder
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.security:spring-security-oauth2-jose'

  // 서버 JWT(access/온보딩) 발급·검증 — HS256 (ADR-0009/0011)
  implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

  // API 문서 — Swagger UI 정적 자산(webjar). 우리 openapi3.yaml을 끼워 서빙 (ADR-0016)
  implementation "org.webjars:swagger-ui:${swaggerUiVersion}"

  // 구조화 로깅 — MDC·StructuredArguments를 1줄 JSON으로 인코딩(ADR-0038). 로그 내용과 전송 경로를 직교로 두어
  // 로깅 자체는 AWS SDK를 타지 않는다 — CloudWatch 반출은 Agent(dev)·awslogs 드라이버(prod)가 맡는다.
  implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

  // 채팅 TEXT 자동 번역 — Advanced v3 client가 ADC를 사용하므로 로컬 ADC와 EC2 WIF가 같은 코드를 공유한다.
  implementation platform("com.google.cloud:libraries-bom:${googleCloudLibrariesBomVersion}")
  implementation 'com.google.cloud:google-cloud-translate'

  // 매물 사진 업로드 — S3(로컬은 endpoint만 바꿔 MinIO, ADR-0041). apache-client는 이 한 경로에 과하고
  // 전이 의존이 넓어 url-connection-client로 대체한다(동기 PutObject/DeleteObjects만 쓴다).
  implementation('software.amazon.awssdk:s3') {
    exclude group: 'software.amazon.awssdk', module: 'apache-client'
    exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
  }
  implementation 'software.amazon.awssdk:url-connection-client'

  // 생성자 주입 보일러플레이트 제거 (docs/convention/code-style.md §3-4)
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  // API 문서 — 테스트 기반 REST Docs(ADR-0007) + OpenAPI3 캡처(Swagger UI, ADR-0017)
  testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
  testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.19.4'
  // 통합 테스트 — 실제 엔진(MySQL·Redis·MongoDB)으로 검증 (test-strategy §4)
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:mysql'
  testImplementation 'org.testcontainers:mongodb'
  // 매물 사진 업로드 어댑터는 실제 S3 프로토콜로 검증한다 — 목으로는 키·URL 조립만 보고 SDK 호출은 못 본다(ADR-0041)
  testImplementation 'org.testcontainers:minio'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    // 신버전 Docker 데몬(29.x) 호환 docker-java가 포함된 Testcontainers로 고정(Boot 관리 버전 오버라이드)
    mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
    // MongoDB 마이그레이션 Mongock 버전 일괄 관리 (ADR-0032)
    mavenBom "io.mongock:mongock-bom:5.5.0"
    // 매물 사진 S3 업로드 — SDK 모듈 간 버전 어긋남을 막으려고 BOM으로 묶는다 (ADR-0041)
    mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
  }
}

// 코드 포맷 자동화 (docs/convention/code-style.md §1)
// 적용: ./gradlew spotlessApply / 검사: ./gradlew spotlessCheck
spotless {
  java {
    googleJavaFormat('1.35.0')
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

ext {
  snippetsDir = file("build/generated-snippets")
}

tasks.named('test') {
  useJUnitPlatform()
  // REST Docs 스니펫 출력 디렉터리 — openapi3 태스크가 수집한다 (ADR-0007·0017)
  outputs.dir snippetsDir
}

// REST Docs 테스트로 캡처한 자원 → OpenAPI3 yaml(Swagger UI가 읽음, ADR-0016)
openapi3 {
  setServer('/') // 상대경로 — Swagger를 서빙한 origin(local·dev·prod)을 자동으로 가리킨다(배포 도메인 대응)
  title = 'Kohere API'
  // info.description — Swagger UI 최상단에 마크다운으로 렌더된다. 스키마·필드 설명으로는 표현할 수 없는
  // "이 문서를 읽는 법"만 둔다(#151). 공통 래퍼 필드 설명은 각 응답 스키마에 이미 들어 있다.
  description = '''\
인증: `Authorization: Bearer <accessToken>`

- 케이스별 응답은 각 status 의 **Examples 드롭다운**에서 확인한다.
- 하나의 엔드포인트가 Schema를 공유하므로 역할별로 요청·응답이 갈릴경우 대상 필드는 schema description을 참고한다.
'''
  // 태그 설명(tagDescriptionsPropertiesFile)은 쓰지 않는다 — 테스트가 태그 「이름」만 정할 수 있고
  // 설명은 빌드 시점 별도 파일로만 넣을 수 있어, 문서의 단일 소스가 테스트라는 원칙(ADR-0007)에서 벗어난다.
  // 태그 이름(com.kohere.docs.ApiDocsTags)이 자체로 설명적이고, 표시 순서는 swagger-ui-initializer.js 가 정한다.
  version = project.version.toString()
  format = 'yaml'
}

// 생성된 OpenAPI 명세의 문서 품질 게이트(#151).
//
// openapi3 가 dependsOn('check') 이므로 이 검증을 check 에 붙이면 순환 의존으로 빌드가 죽는다.
// 산출물 경로(prepareSwaggerUi)에 걸면 assemble→bootJar→prepareSwaggerUi 로 ./gradlew build 에 자동 포함되고
// CI 워크플로(spotlessCheck build)도 수정할 필요가 없다.
//
// 검사하지 않는 것: 응답 스키마의 nullable·enum 회귀. 스키마가 $ref 로 components 에 분리돼 ref 해석 +
// 중첩 properties 재귀가 필요하고, 「null 이 아니라 빈 문자열」 같은 정당한 예외를 구분할 수 없다.
// → docs/convention/test-strategy.md 의 리뷰 체크리스트로 내렸다.
tasks.register('verifyOpenApiSpec') {
  group = 'verification'
  description = 'openapi3.yaml 의 태그·문구·operationId 규약을 검증한다 (#151)'
  dependsOn tasks.named('openapi3')

  // 설정 시점에 캡처 — doLast 에서 project 를 참조하지 않는다(설정 캐시 대비)
  def specFile = layout.buildDirectory.file('api-spec/openapi3.yaml')
  inputs.file(specFile)

  doLast {
    Map spec = new org.yaml.snakeyaml.Yaml().load(specFile.get().asFile.newInputStream())

    def usedTags = [] as Set
    def seenOperationIds = [:]
    def violations = []
    // operationId 는 그 오퍼레이션 스니펫 identifier 들의 commonPrefix 다 — 후행 하이픈(quiz-answer-)이 정상값이라
    // 엄격한 케밥 정규식을 쓰면 정상값을 거부한다. 형식은 느슨하게 두고 유일성·붕괴를 직접 본다.
    def ID_PATTERN = ~/^[a-z][a-z0-9]*(-[a-z0-9]*)*$/

    // 성공 응답이 존재하지 않는 오퍼레이션 — 항상 4xx 다. 허용 목록으로 둬서 "성공 스니펫을 깜빡한 것"과
    // "원래 성공이 없는 것"을 구분한다. 새로 넣을 땐 왜 2xx 가 없는지 근거를 함께 적는다.
    def NO_SUCCESS_RESPONSE = [
        // 종료된 v1 매물 조회 — 상세·찜 토글은 항상 404 LISTING_NOT_FOUND 다(ADR-0040).
        'v1-listing-detail',
        'v1-listing-favorite-add',
        'v1-listing-favorite-remove',
    ] as Set

    spec.paths.each { path, methods ->
      methods.each { method, op ->
        def id = op.operationId
        def where = "${method.toUpperCase()} ${path} (${id})"
        def tags = op.tags ?: []

        if (tags.isEmpty()) {
          violations << "${where}: tags 미지정 — resourceDetails().tag(ApiDocsTags.X) 를 붙여라"
        }
        if (tags.contains('api')) {
          violations << "${where}: 태그가 'api' 로 유추됐다 — 스니펫 하나가 tag 를 빠뜨렸다"
        }
        if (tags.size() > 1) {
          violations << "${where}: 태그가 ${tags} 로 둘 이상이다 — 같은 오퍼레이션의 스니펫이 서로 다른 태그를 쓴다"
        }
        usedTags.addAll(tags)

        if (!op.summary?.trim()) {
          violations << "${where}: summary 없음"
        } else if (op.summary.contains('\n')) {
          violations << "${where}: summary 에 개행이 있다 — 상세는 description 으로 내려라"
        } else if (op.summary.length() > 40) {
          violations << "${where}: summary 가 ${op.summary.length()}자다(40자 이내) — '${op.summary}'"
        }
        if (!op.description?.trim()) {
          violations << "${where}: description 없음"
        }

        if (!id || !(id ==~ ID_PATTERN)) {
          violations << "${where}: operationId 형식 위반"
        } else if (!id.contains('-')) {
          violations << "${where}: operationId 가 '${id}' 로 붕괴했다 — 스니펫 identifier 들의 공통 접두사가 너무 짧다"
        }
        if (seenOperationIds.containsKey(id)) {
          violations << "${where}: operationId '${id}' 가 ${seenOperationIds[id]} 와 중복이다"
        } else {
          seenOperationIds[id] = where
        }

        if (!NO_SUCCESS_RESPONSE.contains(id)
            && !op.responses.keySet().any { it.toString().startsWith('2') }) {
          violations << "${where}: 2xx 응답 없음"
        }
      }
    }

    // 태그 이름은 com.kohere.docs.ApiDocsTags 상수라 오타가 컴파일 타임에 걸린다.
    // 다만 상수를 새로 추가하면 swagger-ui-initializer.js 의 TAG_ORDER 에도 넣어야 정렬된다 —
    // JS 파싱까지 하지는 않으므로 아래 목록을 눈으로 대조한다.
    logger.lifecycle("verifyOpenApiSpec: 사용 태그 ${usedTags.sort()}")

    if (violations) {
      throw new GradleException(
          "OpenAPI 문서 품질 위반 ${violations.size()}건:\n  - " + violations.join('\n  - '))
    }
    logger.lifecycle("verifyOpenApiSpec: 오퍼레이션 ${seenOperationIds.size()}개 · 태그 ${usedTags.size()}종 — 위반 없음")
  }
}

// Swagger UI 정적 자산(webjar) + 우리 openapi3.yaml + 우리 initializer 를 한 디렉터리로 모음
tasks.register('prepareSwaggerUi', Copy) {
  dependsOn tasks.named('openapi3'), tasks.named('verifyOpenApiSpec')
  into layout.buildDirectory.dir('swagger-ui')
  // webjar dist 추출(경로 prefix 제거), petstore용 기본 initializer 는 제외
  from({
    configurations.runtimeClasspath
        .filter { it.name.startsWith('swagger-ui-') }
        .collect { zipTree(it) }
  }) {
    include "META-INF/resources/webjars/swagger-ui/${swaggerUiVersion}/**"
    exclude '**/swagger-initializer.js'
    eachFile { it.path = it.path.replaceFirst(".*/swagger-ui/${swaggerUiVersion}/", '') }
    includeEmptyDirs = false
  }
  // 우리 명세 + 우리 명세를 가리키는 initializer
  from(layout.buildDirectory.dir('api-spec')) { include 'openapi3.yaml' }
  from('src/main/resources/swagger-ui-initializer.js') { rename { 'swagger-initializer.js' } }
}

// bootRun(개발 실행)에서도 Swagger UI(/swagger-ui)를 보기 위한 생성물 모음.
// 무거운 생성(test→openapi3)과 분리 — 필요할 때 한 번 `./gradlew prepareDevStatic` 실행 후
// bootRun 하면 serve된다(미실행 시 그냥 없음 → 빠른 dev 루프 유지).
tasks.register('prepareDevStatic', Copy) {
  dependsOn tasks.named('prepareSwaggerUi')
  into layout.buildDirectory.dir('devstatic/static')
  from(layout.buildDirectory.dir('swagger-ui')) { into 'swagger-ui' }
}

// prepareDevStatic 으로 생성해두면 bootRun 이 classpath:/static/** 로 노출한다(dir 없으면 무시).
tasks.named('bootRun') {
  classpath += files(layout.buildDirectory.dir('devstatic'))
}

// Swagger UI(/swagger-ui)를 실행 jar의 정적 리소스로 번들
tasks.named('bootJar') {
  dependsOn tasks.named('prepareSwaggerUi')
  from(layout.buildDirectory.dir('swagger-ui')) {
    into 'BOOT-INF/classes/static/swagger-ui'
  }
}

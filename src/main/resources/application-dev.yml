# dev 프로파일(SPRING_PROFILES_ACTIVE=dev) — dev 단일 EC2 docker-compose에서 활성(ADR-0021).
# 환경 의존값은 compose env + /opt/kohere/.env(SSM Parameter Store→refresh-env, ADR-0023)로 주입한다.
# 모든 환경 의존값은 폴백 없이 주입을 강제한다(fail-fast) — 값은 tfvars→SSM→refresh-env(.env)/compose로 전량 주입되므로,
#   미주입은 설정 배선 오류다. 조용한 빈 폴백으로 넘기지 않고 기동 실패로 드러낸다.
# 예외: spring.mail.smtp.auth·starttls는 env로 주입하지 않는 앱 상수라 기본값(true)을 유지한다.
# 스키마는 Flyway가 적용하고 Hibernate는 validate만 한다(ADR-0008).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET} # Terraform 자동생성, 미설정 시 기동 실패(ADR-0011 D5)
  auth:
    refresh-pepper: ${REFRESH_PEPPER} # ADR-0006
    email-pepper: ${EMAIL_PEPPER} # 이메일 인증번호 해시 pepper
    phone-pepper: ${PHONE_PEPPER} # 연락처 인증번호 해시 pepper(Terraform 자동생성·SSM, ADR-0023)
    test-login:
      # 테스트 마스터 로그인 기능(공유 EC2). 이 한 토글이 마스터 계정 시드 + 우회 로그인을 함께 켠다.
      # 옵션 기능이라 기본 off + 시크릿 빈 값(폴백) — 미주입이어도 dev는 정상 기동.
      # 켜려면 SSM(TEST_LOGIN_ENABLED=true·TEST_LOGIN_SECRET=<랜덤>)을 refresh-env로 주입한다(ADR-0024). secret 정본은 repo에 없다.
      enabled: ${TEST_LOGIN_ENABLED:false}
      secret: ${TEST_LOGIN_SECRET:}
  oidc:
    google:
      audience: ${GOOGLE_CLIENT_ID}
    apple:
      audience: ${APPLE_CLIENT_ID}
  apple:
    # client-id는 oidc.apple.audience와 동일 env(번들 ID). team-id·key-id·private-key는 client_secret 서명(ADR-0031).
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}
  solapi:
    # 연락처 SMS(SOLAPI, ADR-0034). enabled·from·API 키 모두 SSM→refresh-env(.env)로 주입(폴백 없음 — 전량 주입 강제).
    enabled: ${SOLAPI_ENABLED}
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET} # 1급 시크릿(SSM)
    from: ${SOLAPI_FROM} # 사전 등록 발신번호
  bizno:
    # 사업자번호 검증(비즈노, ADR-0033). enabled·API 키 모두 SSM→refresh-env(.env)로 주입(폴백 없음).
    enabled: ${BIZNO_ENABLED}
    api-key: ${BIZNO_API_KEY} # 시크릿(SSM)

Pattern.landlordOnboardingRequest.phoneNumber=휴대폰 번호 형식이어야 합니다. 하이픈은 있어도 없어도 됩니다(예: 01012345678, 010-1234-5678).
Pattern.updateProfileRequest.phoneNumber=휴대폰 번호 형식이어야 합니다. 하이픈은 있어도 없어도 됩니다(예: 01012345678, 010-1234-5678).
Pattern.signupRequest.phoneNumber=휴대폰 번호 형식이어야 합니다. 하이픈은 있어도 없어도 됩니다(예: 01012345678, 010-1234-5678).
Pattern.signupPhoneVerificationCodeRequest.phoneNumber=휴대폰 번호 형식이어야 합니다. 하이픈은 있어도 없어도 됩니다(예: 01012345678, 010-1234-5678).
Pattern.signupPhoneVerifyRequest.phoneNumber=휴대폰 번호 형식이어야 합니다. 하이픈은 있어도 없어도 됩니다(예: 01012345678, 010-1234-5678).

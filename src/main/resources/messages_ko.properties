Size.signupRequest.email=255자 이하여야 합니다.
# 특수문자 목록·따옴표·중괄호는 넣지 않는다 — errors[].reason 은 인자가 있어 MessageFormat 을 타므로
# 중괄호는 파싱 오류(500)를, 작은따옴표는 뒤 문구 소실을 일으킨다.
Pattern.signupRequest.password=영문자·숫자·특수문자(ASCII)를 각각 1자 이상 포함한 8~10자여야 합니다. 공백과 한글은 사용할 수 없습니다.
Size.bookingReportRequest.detail=500자 이하여야 합니다.

# 에러 메시지 한국어(ko) 번역. 키는 ErrorCode 이름. 키 부재·미지원 언어는 영어(messages.properties)로 폴백. #52 · ADR-0030.
INVALID_INPUT=입력값이 올바르지 않습니다.
MALFORMED_REQUEST=요청 본문을 해석할 수 없습니다.
UNAUTHENTICATED=인증이 필요합니다.
TOKEN_EXPIRED=토큰이 만료되었습니다.
FORBIDDEN=권한이 없습니다.
RESOURCE_NOT_FOUND=리소스를 찾을 수 없습니다.
METHOD_NOT_ALLOWED=허용되지 않은 메서드입니다.
TOO_MANY_REQUESTS=요청이 너무 많습니다.
INTERNAL_ERROR=일시적인 오류가 발생했습니다.
UPSTREAM_ERROR=외부 연동에 실패했습니다.
SERVICE_UNAVAILABLE=서비스를 일시적으로 사용할 수 없습니다.
AUTH_MISSING_CREDENTIAL=소셜 로그인에 필요한 자격 정보가 누락되었습니다.
AUTH_INVALID_SOCIAL_TOKEN=소셜 토큰 검증에 실패했습니다.
AUTH_REQUIRED_AGREEMENT_MISSING=필수 약관에 동의해야 합니다.
AUTH_TERMS_AGREEMENT_REQUIRED=약관 동의가 선행되어야 합니다.
AUTH_EMAIL_VERIFICATION_FAILED=이메일 인증번호가 올바르지 않거나 만료되었습니다.
AUTH_EMAIL_NOT_VERIFIED=이메일 인증이 필요합니다.
AUTH_PHONE_VERIFICATION_FAILED=연락처 인증번호가 올바르지 않거나 만료되었습니다.
AUTH_PHONE_NOT_VERIFIED=연락처 인증이 필요합니다.
AUTH_BUSINESS_NUMBER_VERIFICATION_FAILED=사업자등록번호가 미등록·휴폐업이거나 검증에 실패했습니다.
AUTH_ONBOARDING_REQUIRED=온보딩을 완료해야 합니다.
AUTH_ONBOARDING_ALREADY_COMPLETED=이미 온보딩을 완료했습니다.
AUTH_INVALID_REFRESH_TOKEN=유효하지 않은 refresh 토큰입니다.
USER_NOT_FOUND=사용자를 찾을 수 없습니다.
USER_ALREADY_WITHDRAWN=이미 탈퇴한 사용자입니다.
DIAGNOSIS_NOT_FOUND=진단을 찾을 수 없습니다.
DIAGNOSIS_IDEMPOTENCY_CONFLICT=동일 키로 다른 요청이 접수되었습니다.
LISTING_NOT_FOUND=매물을 찾을 수 없습니다.
LISTING_INVALID_SORT_PARAM=정렬 파라미터가 올바르지 않습니다.
LISTING_INVALID_BBOX=지도 좌표 범위가 올바르지 않습니다.
LISTING_AREA_TOO_LARGE=검색 범위가 너무 넓습니다.
BOOKING_ALREADY_EXISTS=이미 신청한 매물입니다.
BOOKING_INVALID_MOVE_IN_DATE=입주 희망일이 올바르지 않습니다.
BOOKING_SELF_NOT_ALLOWED=본인 소유 매물에는 신청할 수 없습니다.
CHAT_ROOM_NOT_FOUND=채팅방을 찾을 수 없습니다.
CHAT_SELF_INQUIRY_NOT_ALLOWED=본인 소유 매물에는 문의할 수 없습니다.
CHAT_ROOM_INACTIVE=비활성 채팅방입니다.
CHAT_MESSAGE_NOT_IN_ROOM=해당 방의 메시지가 아닙니다.
POST_NOT_FOUND=게시글을 찾을 수 없습니다.
COMMENT_NOT_FOUND=댓글을 찾을 수 없습니다.
POST_CHAT_SELF_NOT_ALLOWED=본인 게시글에는 채팅을 시작할 수 없습니다.
POST_CHAT_AUTHOR_UNAVAILABLE=작성자와 채팅할 수 없습니다.
POST_CHAT_BLOCKED=차단 관계로 채팅을 시작할 수 없습니다.
QUIZ_NOT_FOUND=퀴즈를 찾을 수 없습니다.
REPORT_TARGET_NOT_FOUND=신고 대상을 찾을 수 없습니다.
REPORT_ALREADY_EXISTS=이미 신고한 대상입니다.
REPORT_SELF_TARGET=본인 콘텐츠는 신고할 수 없습니다.

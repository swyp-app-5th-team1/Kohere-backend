# 통합 테스트 프로파일(@ActiveProfiles("test")). datasource·redis는 Testcontainers
# @ServiceConnection이 동적으로 주입하므로 여기 두지 않는다. Flyway가 컨테이너에 V1을 적용하고
# Hibernate validate가 엔티티↔스키마 일치를 검증한다(ADR-0008). 시크릿은 테스트 전용 고정값.
spring:
  # 전체 컨텍스트 부팅 테스트(KohereApplicationTests)는 SmtpVerificationEmailSender를 그대로 구성하므로
  # JavaMailSender 빈이 필요하다. host만 지정하면 MailSenderAutoConfiguration이 빈을 만들고(부팅 시 접속하지
  # 않음, 실제 발송 시에만 연결) — 메일을 실제 발송하는 테스트는 VerificationEmailSender 포트를 @MockitoBean으로 대체한다.
  mail:
    host: localhost
    port: 3025
app:
  mongo:
    indexes-enabled: false
  jwt:
    secret: test-only-hs256-secret-please-override-32bytes-minimum!!
  auth:
    refresh-pepper: test-refresh-pepper
    email-pepper: test-email-pepper # 이메일 인증번호 해시(테스트 고정). 메일 발송은 VerificationEmailSender를 @MockBean으로 대체
    phone-pepper: test-phone-pepper # 연락처 인증번호 해시(테스트 고정). SMS 발송은 SOLAPI 비활성 → LoggingVerificationSmsSender 폴백
    web:
      password-reset:
        # 임대인 웹 SPA 가 이 환경에 있으므로 계정 복구를 켠다(base 는 false — 운영 미배포).
        enabled: true

  # 계정 복구 문서·통합 테스트가 재설정 링크를 조립하려면 기능이 켜져 있고 base-url 이 유효해야 한다.
  web:
    base-url: https://web.test.kohere.app
  oidc:
    google:
      audience: test-google-client-id
    apple:
      audience: test-apple-client-id
  apple:
    # 테스트 고정값 — 컨텍스트 로딩용. 실제 Apple 연동은 AppleAuthClient 포트를 @Bean @Primary 스텁으로 대체하므로
    # private-key는 파싱되지 않는다(placeholder). client-id는 oidc.apple.audience와 동일.
    client-id: test-apple-client-id
    team-id: test-team-id
    key-id: test-key-id
    private-key: test-apple-private-key-placeholder
  naver:
    search:
      # 테스트 컨텍스트 기동용 더미 값. HTTP 어댑터 단위 테스트는 MockRestServiceServer로 실제 네트워크를 차단한다.
      client-id: test-naver-client-id
      client-secret: test-naver-client-secret
    geocode:
      # 주소 검색(ADR-0042)도 같은 이유의 더미 값이다. 문서 테스트는 AddressSearchClient를 목으로 대체한다.
      client-id: test-ncp-geocode-client-id
      client-secret: test-ncp-geocode-client-secret
  kakao:
    local:
      # 역 검색·대학 파생(ADR-0044)도 같은 이유의 더미 값이다.
      # 어댑터 테스트는 MockRestServiceServer로, 문서 테스트는 포트 목으로 네트워크를 막는다.
      rest-api-key: test-kakao-rest-api-key
  images:
    # enabled=false → StubListingImageStorage 폴백. 문서·컨트롤러 테스트가 저장소 없이 등록 흐름을 그대로 탄다.
    # 어댑터 자체는 MinIO 컨테이너를 띄우는 통합 테스트가 검증한다.
    enabled: false
    bucket: test-images-bucket
    cdn-domain: cdn.test.kohere.app

# Mongock 비활성 — 테스트는 Mongo 미가용(슬라이스 테스트만 Testcontainers). 1회성 마이그레이션은 test에서 돌리지 않는다.
mongock:
  enabled: false

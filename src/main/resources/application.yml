server:
  # dev의 Caddy와 prod의 ALB가 HTTPS를 종료한 뒤 Spring에는 HTTP로 전달한다. Tomcat이 신뢰 가능한
  # 내부 프록시의 X-Forwarded-*를 읽어야 외부의 원래 https Origin과 /ws/chat 요청 주소를 정확히 비교할 수 있다.
  forward-headers-strategy: native

spring:
  application:
    name: kohere

  # 활성 프로파일 미지정 시 로컬(개발 편의). 운영은 SPRING_PROFILES_ACTIVE=prod, 테스트는 @ActiveProfiles("test").
  profiles:
    default: local

  # 스키마는 Flyway가 소유(ADR-0008). Hibernate는 검증만 — 엔티티↔스키마 불일치를 기동 시 차단.
  # datasource·redis 접속값은 프로파일별 파일(local/test/prod)에서 주입한다.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC

  modulith:
    events:
      # 처리에 성공한 이벤트 publication은 삭제한다. BOOKING_CARD에 필요한 신청자 사본이 이벤트 로그에
      # 중복 보관되는 시간을 최소화하고, 최종 정본은 chat_messages.payload 한 곳에만 남긴다.
      completion-mode: delete
      # 예약 커밋 뒤 서버가 종료되어 채팅 처리가 끝나지 못한 경우, 다음 기동 때 미완료 이벤트를 다시 전달한다.
      # BOOKING_CARD는 bookingId UNIQUE로 멱등 처리하므로 중복 전달돼도 카드가 두 장 생기지 않는다.
      republish-outstanding-events-on-restart: true

  # 에러 메시지 i18n: ErrorCode 이름을 키로 messages[_<lang>].properties에서 번역(ADR-0030, #52).
  # 미지원 언어·키 부재는 영어(messages.properties)로 폴백. locale은 Accept-Language로 결정(기본 en).
  # (본문 콘텐츠 i18n은 리소스 번들이 아니라 DB 카탈로그의 언어별 컬럼/맵으로 둔다 — 예약 신고 사유는 booking_report_reasons, #169.)
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: en
    locale-resolver: accept-header

  # 사진 업로드는 요청 하나에 파일 하나다(ADR-0041). 장당 상한(10MB)은 서블릿이 아니라 도메인이 본다 —
  # 서블릿이 먼저 끊으면 LISTING_IMAGE_TOO_LARGE 대신 형식·장수 위반과 구분되지 않는 일반 실패가 나간다.
  # 서블릿은 상식 밖 크기만 막는 백스톱이며 임계 초과는 413 PAYLOAD_TOO_LARGE다.
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: 32MB

# 로그 레벨을 명시한다(ADR-0038). 이전에는 저장소 전체에 선언이 0건이라 Boot 기본값에 암묵 의존했다 —
# 기본값이 바뀌면 조용히 따라 움직인다. appender 구성은 logback-spring.xml이 소유하고 레벨은 여기가 정본이다.
# DEBUG는 local 전용(application-local.yml)이고 dev·prod는 root=INFO로 억제한다.
logging:
  level:
    root: INFO
    "[org.flywaydb]": INFO
    "[io.mongock]": INFO

# 인증·토큰 정책값(비밀 아님). 시크릿·환경 의존값(secret·pepper·oidc audience·datasource)은
# 프로파일별 파일에서 주입한다 — base에는 운영-위험 기본값(시크릿 폴백·접속정보)을 두지 않는다.
app:
  chat:
    websocket:
      # 값을 비워 두면 Spring의 안전한 기본값인 같은 Origin만 허용한다. 웹과 API가 다른 Origin으로
      # 분리되는 환경에서만 콤마로 구분한 정확한 Origin을 환경변수로 주입하며 '*'는 사용하지 않는다.
      allowed-origins: ${APP_CHAT_WEBSOCKET_ALLOWED_ORIGINS:}
      # Simple Broker는 통신이 없을 때 10초마다 연결 상태를 확인한다. REST polling 주기와는 무관하다.
      heartbeat-interval: 10s
      # WebSocket 조각을 Spring이 합친 뒤의 STOMP frame 전체 상한이다. TEXT 3,000자 제한과 별개다.
      message-size-limit-bytes: 65536
      # handshake만 열어 둔 익명 연결이 CONNECT 없이 자원을 계속 점유하지 못하게 한다.
      time-to-first-message: 10s
  jwt:
    issuer: kohere
    access-ttl-seconds: 3600 # access 1시간 (ADR-0011)
    onboarding-ttl-seconds: 1800 # 온보딩 임시 토큰 30분 (ADR-0011)
  auth:
    refresh-ttl-seconds: 1209600 # refresh 14일 (ADR-0011)
    web:
      # 임대인 웹 로컬 로그인 정책(ADR-0047). 웹 refresh TTL은 위 refresh-ttl-seconds를 그대로 쓴다.
      login-max-failed-attempts: 5 # 비밀번호 연속 실패 상한 — 도달 시 계정 잠금(자동 해제 없음)
      login:
        # 로그인 시도 레이트리밋(US-1-12). 위 잠금 임계값이 "한 계정을 잠그는" 값이라면 이쪽은 "요청을 받아 주는" 값이다.
        # 두 가지를 동시에 막는다 — ① 남의 이메일로 5회 틀려 잠그는 DoS(해제 경로가 없어 피해가 영구적이다)
        # ② permitAll 경로에서 선행 조건 없이 BCrypt 라운드를 강제하는 CPU 증폭(가입은 SMS 인증 마커 뒤에 있다).
        # 그래서 카운터는 자격증명 조회·해시 대조보다 먼저 올린다 — 막힌 요청은 해시 비용을 치르지 않는다.
        ip-max-per-hour: 30 # 같은 IP에서 1시간에 허용하는 시도(초과 시 429). 공유 IP(사무실 NAT)를 감안해 이메일보다 넉넉하다
        email-max-per-hour: 10 # 같은 이메일로 1시간에 허용하는 시도(초과 시 429). 잠금 임계값 5보다 크게 둬 정상 오타를 막지 않는다
      refresh-cookie:
        # 웹 refresh 토큰의 전송 채널(ADR-0048). 앱은 응답 본문으로 받지만 브라우저는 XSS 한 번에 14일 세션이
        # 통째로 넘어가므로 스크립트가 읽을 수 없는 HttpOnly 쿠키로만 내린다. HttpOnly는 끌 수 있으면 안 되는
        # 값이라 설정으로 빼지 않는다(RefreshTokenCookies가 상수로 고정). Max-Age도 키를 만들지 않고 위
        # refresh-ttl-seconds(14일)를 그대로 따라간다 — 값이 갈리면 진짜 만료가 두 벌이 된다.
        name: refreshToken # 본문 필드명과 같은 이름 — 재발급·로그아웃이 쿠키·본문 어느 쪽에서 읽든 같은 값이다
        path: /api/v1/auth # 재발급·로그아웃 경로에만 실린다(매물·사진·진단 요청에 refresh가 딸려가지 않는다)
        same-site: Lax # 크로스사이트 POST에 쿠키가 실리지 않는다 → csrf.disable() 유지의 근거(동일 오리진 전제)
        secure: true # 평문 구간 유출 방지. local 프로파일에서만 false로 내린다(로컬은 http)
    signup-phone:
      # 비로그인 가입용 연락처 SMS 인증(US-1-13)의 남용 방지 한도. 인증번호 자릿수·TTL·시도 상한·재발송 간격은
      # 온보딩용과 같은 정책이라 아래 app.phone.*를 그대로 재사용하고, 여기엔 이 경로에만 필요한 값만 둔다 —
      # permitAll이라 토큰으로 주체를 묶을 수 없어 번호·IP가 유일한 식별자다(문자 폭탄·발송비 방어).
      phone-max-per-hour: 5 # 같은 번호로 1시간에 허용하는 발송 시도(초과 시 429)
      ip-max-per-hour: 20 # 같은 IP에서 1시간에 허용하는 발송 시도(초과 시 429)
    test-login:
      # dev·local 테스트 마스터 로그인 우회(운영 미사용). 기본 비활성 — 프로파일(local·dev) + 이 토글 이중 게이트.
      # 활성화·시크릿은 프로파일별 파일에서만 주입한다(base엔 운영-위험 기본값을 두지 않음).
      enabled: false
    fixed-verification:
      # 앱스토어 심사 계정 전용 고정 인증번호(이슈 #180, 운영 미사용). 심사자가 실제 SMS·메일을 받을 수 없어
      # 지정 계정에 한해 인증번호를 고정하고 외부 발송을 생략한다. 기본 비활성 — 프로파일(local·dev) + 이 토글 이중 게이트.
      # 활성화·코드·심사 계정은 프로파일별 파일에서만 주입한다(base엔 운영-위험 기본값을 두지 않음).
      enabled: false
  terms:
    version: v1.0 # 약관 버전 정본 — 약관 동의 시 서버가 기록 (ADR-0012)
  email:
    # 온보딩 이메일 인증 정책값(비밀 아님). 모두 잠정값 — 운영 확정 필요(문서 §6).
    code-length: 6 # 인증번호 자릿수
    code-ttl-seconds: 300 # 인증번호 만료(5분)
    verified-ttl-seconds: 1800 # 검증 완료 마커 보존(30분, 온보딩 토큰 만료 정도)
    max-attempts: 5 # 검증 시도 상한(초과 시 429)
    resend-interval-seconds: 60 # 재발송 최소 간격(미달 시 429)
    from: ${MAIL_FROM:noreply@kohere.app} # 발신 이메일 주소
  phone:
    # 임대인 연락처 SMS 인증 정책값(비밀 아님). 세입자 이메일 인증과 통일(ADR-0034, 문서 §6).
    code-length: 6 # 인증번호 자릿수
    code-ttl-seconds: 300 # 인증번호 만료(5분)
    verified-ttl-seconds: 1800 # 검증 완료 마커 보존(30분)
    max-attempts: 5 # 검증 시도 상한(초과 시 429)
    resend-interval-seconds: 60 # 재발송 최소 간격(미달 시 429)
  business:
    verified-ttl-seconds: 1800 # 사업자번호 검증 마커 보존(30분). provider 설정은 app.bizno(프로파일별)
  oidc:
    # 소셜 OIDC 검증(JWKS). audience(우리 client ID)는 환경 의존값이라 프로파일별로 주입.
    google:
      issuer: https://accounts.google.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    apple:
      issuer: https://appleid.apple.com
      jwk-set-uri: https://appleid.apple.com/auth/keys
  apple:
    # Apple 인가코드 교환·폐기 + client_secret(ES256 JWT) 설정 (ADR-0031). 비밀(team-id·key-id·client-id·private-key=.p8)은
    # 프로파일별로 주입한다. client-id는 app.oidc.apple.audience와 동일한 번들 ID여야 한다(Services ID 아님).
    token-url: https://appleid.apple.com/auth/token
    revoke-url: https://appleid.apple.com/auth/revoke
    audience: https://appleid.apple.com # client_secret JWT의 aud(Apple 토큰 엔드포인트, 상수)
    client-secret-ttl-seconds: 1800 # client_secret 캐시 만료(≤6개월, 만료 전 재서명)
    connect-timeout-millis: 3000 # Apple 외부 호출 connect 타임아웃(탈퇴·로그인 비차단용 짧은 값)
    read-timeout-millis: 5000 # Apple 외부 호출 read 타임아웃
  naver:
    search:
      # 네이버 지역 검색의 비밀이 아닌 네트워크 기본값. Client ID/Secret은 환경별 프로파일에서만 주입한다.
      base-url: https://openapi.naver.com
      connect-timeout-millis: 3000
      read-timeout-millis: 5000
    geocode:
      # NCP Maps Geocoding(도로명 주소 검색, ADR-0042)의 비밀이 아닌 기본값. 자격증명은 환경별 프로파일에서만 주입한다.
      # base-url 기본값은 NCP Maps 개요(신규 Application 등록) 기준이다. 발급 키가 구 도메인만 받으면
      # https://naveropenapi.apigw.ntruss.com 으로 바꾼다 — 경로·헤더는 양쪽이 같아 코드 변경이 없다.
      base-url: https://maps.apigw.ntruss.com
      connect-timeout-millis: 3000
      read-timeout-millis: 5000
  kakao:
    local:
      # 카카오 로컬 API(인근 역 검색, ADR-0044)의 비밀이 아닌 기본값.
      # REST API 키는 환경별 프로파일에서만 주입한다 — 네이버·NCP와 콘솔이 달라 값을 공유하지 않는다.
      base-url: https://dapi.kakao.com
      connect-timeout-millis: 3000
      read-timeout-millis: 5000
  images:
    # 매물 사진 저장소(ADR-0041). 버킷·CDN 도메인은 비밀이 아니지만 환경마다 달라 프로파일에서 주입한다.
    # enabled=false면 실제 저장소 대신 스텁이 등록돼 업로드 없이 URL만 만든다 — base는 안전한 쪽을 기본으로 둔다.
    enabled: false
    region: ap-northeast-2

# MongoDB 1회성 마이그레이션(Mongock @ChangeUnit) — Flyway의 MongoDB 대응(ADR-0032).
# @ChangeUnit은 컬렉션 소유 모듈의 infrastructure에 두고 com.kohere 하위를 스캔한다. test는 비활성(application-test.yml).
mongock:
  migration-scan-package:
    - com.kohere
  # 마이그레이션은 로컬 fixture·인덱스 등 ApplicationRunner보다 먼저 끝나야 한다.
  # 기본 ApplicationRunner 방식은 실행 순서가 같아, v3 fixture가 v2 validator에 먼저 저장되는 기동 실패를 만들 수 있다.
  runner-type: InitializingBean
  transactional: false # 단일 노드 Mongo·DocumentDB는 멀티도큐먼트 트랜잭션 미지원

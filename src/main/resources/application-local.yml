# 로컬 개발 프로파일(기본). docker-compose(mysql:3306·redis:6379) 또는 로컬 설치 인프라.
# Flyway가 스키마를 적용한다(ADR-0008). 시크릿은 dev 폴백 제공 — 운영에서는 절대 쓰지 않는다.
# 주의: 이전에 ddl-auto=update로 만든 로컬 DB가 있으면 Flyway 도입 후 충돌할 수 있다 →
#       `docker compose down -v`로 초기화 후 재기동(Flyway가 V1부터 생성).
spring:
  # 로컬 실행(bootRun) 시 프로젝트 루트 .env(KEY=VALUE·gitignore)를 선택적으로 로드해 ${ENV} 치환에 반영한다.
  # optional: 파일이 없어도 무시, [.properties]: 확장자 없는 .env를 properties 포맷으로 파싱. 워킹디렉터리(루트)에서 실행할 것.
  # docker compose는 .env를 자동 인식하므로 이 설정은 호스트 JVM(bootRun) 전용이다. local 프로파일에만 두어 test/prod엔 영향 없음.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:mysql://localhost:3306/kohere?serverTimezone=UTC
    username: kohere
    password: kohere
  data:
    redis:
      host: localhost
      port: 6379
    #MongoDB 추가
    mongodb:
      uri: mongodb://localhost:27017/kohere

  # 온보딩 이메일 인증 SMTP. 로컬은 MailHog 등(localhost:1025) 기본 — 미가용 시 발송이 502로 실패한다(설계상 정상).
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

app:
  # 로그 JSON 파일 디렉터리(logback-spring.xml의 JSON_FILE). /logs 대신 프로젝트 루트 상대경로 — 절대경로면 Windows에서 C:\logs로 튄다.
  # compose로 띄울 때는 APP_LOG_DIR=/logs가 주입되고 ./logs 바인드 마운트로 호스트에서 바로 보인다.
  log:
    dir: ${APP_LOG_DIR:logs}
  seed:
    listings-enabled: ${LISTING_SEED_ENABLED:true}
  jwt:
    # HS256 시크릿: 최소 256bit(32byte). 운영은 prod 프로파일이 폴백 없이 JWT_SECRET을 강제한다.
    secret: ${JWT_SECRET:local-dev-only-hs256-secret-please-override-32bytes-min!!}
  # 임대인 웹(SPA) 오리진 — 재설정 링크 base URL(#272). 로컬 SPA 개발 서버 기본값이며 .env 로 덮어쓸 수 있다.
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  auth:
    refresh-pepper: ${REFRESH_PEPPER:local-dev-refresh-pepper} # SHA-256(token+pepper) (ADR-0006)
    email-pepper: ${EMAIL_PEPPER:local-dev-email-pepper} # 이메일 인증번호 해시 pepper(재설정 토큰 해시도 이 pepper를 쓴다 — #272)
    phone-pepper: ${PHONE_PEPPER:local-dev-phone-pepper} # 연락처 인증번호 해시 pepper
    web:
      password-reset:
        # 임대인 웹 SPA 가 이 환경에 있으므로 계정 복구를 켠다(base 는 false — 운영에 임대인 웹이 없다).
        enabled: true
      refresh-cookie:
        # 로컬은 평문 http라 Secure 쿠키를 브라우저가 저장·전송하지 않는다 → 재발급이 조용히 깨지고 서버 로그엔
        # "refresh 없음"으로만 남는다. base는 안전한 쪽(true)을 기본으로 두고 여기서만 내린다(ADR-0048 §2).
        secure: false
    test-login:
      # 테스트 마스터 로그인 기능 — 한 토글이 마스터 계정 시드 + 우회 로그인을 함께 켠다.
      # localhost 전용이라 폴백 시크릿 무해(JWT_SECRET 로컬 폴백과 동일 논리).
      enabled: ${TEST_LOGIN_ENABLED:true}
      secret: ${TEST_LOGIN_SECRET:local-dev-test-login-secret}
    fixed-verification:
      # 앱스토어 심사 계정 고정 인증번호(이슈 #180). 기본 off, 심사 계정은 env로 주입한다.
      enabled: ${FIXED_VERIFICATION_ENABLED:false}
      code: ${FIXED_VERIFICATION_CODE:000000}
      tenant:
        google-emails: ${FIXED_VERIFICATION_TENANT_GOOGLE_EMAILS:}
        emails: ${FIXED_VERIFICATION_TENANT_EMAILS:}
      landlord:
        google-emails: ${FIXED_VERIFICATION_LANDLORD_GOOGLE_EMAILS:}
        phone-numbers: ${FIXED_VERIFICATION_LANDLORD_PHONES:}
  oidc:
    google:
      audience: ${GOOGLE_CLIENT_ID:}
    apple:
      audience: ${APPLE_CLIENT_ID:}
  apple:
    # 로컬 옵션 — 빈 폴백이면 Apple 로그인만 미동작. 실제 Apple 연동 테스트 시 .p8 등을 env로 주입한다.
    client-id: ${APPLE_CLIENT_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  solapi:
    # 연락처 SMS(SOLAPI, ADR-0034). 로컬은 enabled=false → LoggingVerificationSmsSender 폴백(실발송 안 함, 콘솔 로그).
    # API KEY·SECRET은 환경변수 관리 — 로컬은 폴백값(운영 미사용). 실연동 테스트 시 env로 실제 값 주입.
    enabled: ${SOLAPI_ENABLED:false}
    api-key: ${SOLAPI_API_KEY:local-dev-solapi-key}
    api-secret: ${SOLAPI_API_SECRET:local-dev-solapi-secret}
    from: ${SOLAPI_FROM:01000000000}
  bizno:
    # 사업자번호 검증(비즈노, ADR-0033). 로컬은 enabled=false → StubBusinessRegistryVerifier 폴백(숫자 10자리면 통과).
    # API KEY는 환경변수 관리 — 로컬은 폴백값(운영 미사용). 실검증 테스트 시 env로 실제 값 주입.
    enabled: ${BIZNO_ENABLED:false}
    api-key: ${BIZNO_API_KEY:local-dev-bizno-key}
  naver:
    search:
      # 로컬은 프로젝트 루트 .env에서 주입한다. 빈 값이면 다른 기능은 기동되고 장소 검색 호출만 502로 실패한다.
      client-id: ${NAVER_SEARCH_CLIENT_ID:}
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
    geocode:
      # NCP 콘솔에서 발급한 Maps 자격증명이다 — 위 search(네이버 Developers)와 다른 값이니 섞어 넣지 않는다.
      # 빈 값이면 다른 기능은 기동되고 주소 검색 호출만 502로 실패한다.
      client-id: ${NAVER_GEOCODE_CLIENT_ID:}
      client-secret: ${NAVER_GEOCODE_CLIENT_SECRET:}
  kakao:
    local:
      # 카카오 개발자 콘솔에서 발급한 REST API 키다 — 위 naver(Developers·NCP)와 다른 값이니 섞어 넣지 않는다.
      # 빈 값이면 다른 기능은 기동되고 역 검색 호출만 502로 실패한다.
      rest-api-key: ${KAKAO_REST_API_KEY:}
  images:
    # 매물 사진 저장소(ADR-0041) — docker compose의 MinIO를 쓴다. S3와 같은 API라 배포 환경과 같은 어댑터가 돌아간다.
    #   인프라만 띄웠다면: docker compose up -d minio minio-init
    # MinIO를 안 띄우고 다른 기능만 볼 땐 APP_IMAGES_ENABLED=false로 스텁 폴백(업로드 없이 URL만 생성)을 쓴다.
    enabled: ${APP_IMAGES_ENABLED:true}
    bucket: ${APP_IMAGES_BUCKET:kohere-local-images}
    # 컨테이너 안(app 서비스)에서는 minio:9000, 호스트에서 bootRun 할 땐 localhost:9000이다.
    endpoint: ${APP_IMAGES_ENDPOINT:http://localhost:9000}
    # MinIO는 가상 호스트 스타일을 쓰면 bucket.localhost를 DNS로 찾지 못해 실패한다.
    path-style-access: true
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    # 응답 URL을 로컬 브라우저에서 그대로 열 수 있게 스킴·버킷 경로까지 지정한다(배포는 cdn-domain을 쓴다).
    public-base-url: ${APP_IMAGES_PUBLIC_BASE_URL:http://localhost:9000/kohere-local-images}
